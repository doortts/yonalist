[package]
name = "yonalist-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[features]
default = []
test-support = ["dep:tempfile"]

[dependencies]
ciborium = "0.2"
data-encoding = "2"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tempfile = { version = "3", optional = true }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "sync-lab"
path = "src/bin/sync-lab.rs"
required-features = ["test-support"]
