[package]
name = "yonalist"
version = "0.1.0"
description = "Offline-first GitHub issue and pull request client"
authors = ["doortts"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "yonalist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
base64 = "0.22"
keyring = "3"
open = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.8.0", features = [] }
tauri-plugin-notification = "2"
tauri-runtime = "=2.8.0"
ureq = "2"

[dev-dependencies]
tempfile = "3"
