[package]
name = "yonalist"
version = "0.1.0"
description = "Offline-first GitHub issue and pull request client"
authors = ["doortts"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "yonalist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
base64 = "0.22"
keyring = "3"
lopdf = { version = "0.39", default-features = false }
open = "5"
printpdf = { version = "0.9.1", default-features = false, features = ["text_layout"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.8.0", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-runtime = "=2.8.0"
tempfile = "3"
ureq = "2"

# macOS-only: read the OS major version (NSProcessInfo) so the window controls
# can follow the native inset conventions per release (Tahoe vs earlier).
# Already present transitively via tao/tauri at this exact version, so declaring
# it here only makes the `NSProcessInfo` API usable — it pulls in no new crate.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSProcessInfo"] }
