[package]
name = "yonalist"
version = "0.1.0"
description = "Local-first outliner with pluggable external sources"
authors = ["doortts"]
edition = "2021"
rust-version = "1.97"

[lib]
name = "yonalist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "0.22"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
fs4 = "1.1.0"
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
icu_casemap = "=2.2.0"
keyring = "4.1.4"
lopdf = { version = "0.44", default-features = false }
notify = "8"
open = "5.4"
printpdf = { version = "0.11.1", default-features = false, features = ["images", "text_layout"] }
rusqlite = { version = "0.40.1", features = ["bundled", "functions", "hooks"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"
tauri-runtime = "=2.11.3"
tempfile = "3"
unicode-normalization = "0.1"
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
ureq = "3.3"
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
png = "0.18.1"

# macOS-only: read the OS major version (NSProcessInfo) so the window controls
# can follow the native inset conventions per release (Tahoe vs earlier).
# Already present transitively via tao/tauri at this exact version, so declaring
# it here only makes the `NSProcessInfo` API usable — it pulls in no new crate.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSProcessInfo"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
