[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/notes-application",
  "crates/notes-core",
  "crates/notes-export",
  "crates/notes-sqlite",
]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"

[workspace.dependencies]
notes-application = { path = "crates/notes-application" }
notes-core = { path = "crates/notes-core" }
notes-export = { path = "crates/notes-export" }
rusqlite = { version = "0.40.1", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ts-rs = "12.0.1"
uuid = { version = "1", features = ["v4", "v5"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
