[package]
name = "yonalist-v2-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "yonalist_v2_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Declared, deliberately not enabled: a shipped release carries no inspector
# unless someone opts in with `--features devtools`. Debug builds get it free.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
notes-application.workspace = true
notes-core.workspace = true
notes-export.workspace = true
notes-sqlite = { path = "../../../crates/notes-sqlite" }
notes-sync = { path = "../../../crates/notes-sync" }
# Same major as v1 ran on: FSEvents on macOS, inotify on Linux.
notify = "8"
open = "5.4"
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.1"
uuid.workspace = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.4.3"

# macOS-only: read the OS major version (NSProcessInfo) so the window controls
# can follow the native inset conventions per release (Tahoe vs earlier).
# Already present transitively via tao/tauri at this exact version, so declaring
# it here only makes the `NSProcessInfo` API usable — it pulls in no new crate.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSProcessInfo"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"
