[[permission]]
identifier = "main-window-notes-commands"
description = "Allows the Yonalist v2 main window to invoke the bounded Notes API."
commands.allow = [
  "notes_bootstrap",
  "notes_query_viewport",
  "notes_query_forest",
  "notes_execute",
  "notes_undo",
  "notes_redo",
  "notes_search",
  "notes_close_session",
  "notes_import_image_bytes",
  "notes_import_image_paths",
  "notes_read_image",
]
