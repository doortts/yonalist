  <path class="edgeHot" d="M1100 900 C1040 1035 940 1080 932 1200"/>
  <path class="edgeHot" d="M1300 900 C1390 1035 1515 1080 1522 1200"/>
  <path class="edgeHot" d="M1430 900 C1640 1025 1970 1065 2087 1200"/>
  <path class="edgeSoft" d="M342 1370 C410 1435 585 1435 740 1460"/>
  <path class="edgeSoft" d="M932 1370 C900 1425 830 1430 740 1460"/>
