# The frozen v1 tree. It is not deleted yet because the file-SSOT port copies
# from it, so its jobs stay — but behind paths filters, because v1 sources have
# not moved since 2026-07-29 and every unconditional minute here is paid by v2
# changes that cannot affect v1. GitHub has no job-level paths filter, which is
# why these jobs live in their own workflow. Anchors are avoided: the Actions
# parser does not support them, so both trigger lists are written out.
name: CI (v1 frozen)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-v1.yml
      - index.html
      - package-lock.json
      - package.json
      - rust-toolchain.toml
      - scripts/**
      - src-tauri/**
      - src/**
      - tsconfig.json
      - vite.config.ts
  pull_request:
    paths:
      - .github/workflows/ci-v1.yml
      - index.html
      - package-lock.json
      - package.json
      - rust-toolchain.toml
      - scripts/**
      - src-tauri/**
      - src/**
      - tsconfig.json
      - vite.config.ts

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust performance gate
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored
