name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Git 2.49+ and Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev \
            pkg-config
      - name: Verify Git version
        run: git --version
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Standalone Git runtime probe
        run: cargo test --manifest-path src-tauri/crates/yonalist-sync/Cargo.toml --test git_runtime -- --nocapture --test-threads=1
      - name: Standalone sync core tests
        run: cargo test --manifest-path src-tauri/crates/yonalist-sync/Cargo.toml --all-features
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  sync-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Compile standalone Windows Job Object path
        run: cargo check --manifest-path src-tauri/crates/yonalist-sync/Cargo.toml --all-targets --all-features
