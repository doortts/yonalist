[package]
name = "notes-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# `clock` is what reads the device's own zone, which the readable time is
# written at.
chrono = { version = "0.4", default-features = false, features = [
    "alloc",
    "clock",
] }
libc = "0.2"
notes-application.workspace = true
notes-core.workspace = true
rusqlite.workspace = true
sha2 = "0.10"
tempfile = "3.27.0"
unicode-normalization = "0.1.25"
uuid.workspace = true

# Already in the lock by way of tauri, so this adds edges and no crates. The
# features are the headers this crate names and nothing else.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSError",
    "NSFileCoordinator",
    "NSFileVersion",
    "NSString",
    "NSURL",
] }

# iOS has no `gethostuuid`, so the device seed comes from a value this app
# stores in the keychain instead. Keychain Services is plain C on both Apple
# platforms, which is why no Swift plugin is needed. `core-foundation` is
# already in the lock, so this adds two crates and touches no other target.
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
proptest = "1.9.0"
